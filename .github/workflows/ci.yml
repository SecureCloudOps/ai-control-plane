name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install router dependencies
        run: python -m pip install -r control-plane/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q control-plane
      - name: Test router
        run: python -m unittest discover -s control-plane -p 'test_*.py'
